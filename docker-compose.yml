# Spark 4.2.0 in local mode + History Server. Commands: see README.md or `make help`.
#
# The project folder is mounted at /work. Host folders with the data come from .env
# (GAIA_RAW -> /data/raw, ELBADRY -> /data/elbadry) and must exist: `make init` creates them.

x-spark: &spark-base
  build: .
  image: gaia-binaries-spark:4.2.0
  working_dir: /work
  environment:
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"
    MPLCONFIGDIR: /tmp/matplotlib   # the spark user has no home folder, and healpy imports matplotlib
    PYTHONPATH: /work:/opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.9-src.zip
  volumes:
    - ./:/work:z
    - ./conf:/opt/spark/conf:ro,z
    - ./spark-events:/opt/spark/spark-events:z
    - ${GAIA_RAW:-./data/raw}:/data/raw:ro,z
    - ${ELBADRY:-./data/elbadry}:/data/elbadry:ro,z

services:
  spark:
    <<: *spark-base
    ports:
      - "4040:4040"
    stdin_open: true
    tty: true
    command: ["bash"]

  history:
    <<: *spark-base
    ports:
      - "18080:18080"
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_HISTORY_OPTS: "-Dspark.history.fs.update.interval=5s"
    command: ["/opt/spark/sbin/start-history-server.sh"]
    restart: unless-stopped
