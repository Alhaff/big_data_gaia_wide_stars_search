# Spark settings of the project. Per-run changes go through spark-submit --conf.

spark.master                      local[*]
# 2g is not enough: stage 2 keeps whole cells with star copies in memory
spark.driver.memory               6g

# event log for the History Server (http://localhost:18080)
spark.eventLog.enabled            true
spark.eventLog.dir                file:///opt/spark/spark-events
spark.history.fs.logDirectory     file:///opt/spark/spark-events
# compressed logs are several times smaller (the full run log is kept in evidence/)
spark.eventLog.compress           true

# Python inside the container
spark.pyspark.python              python3
