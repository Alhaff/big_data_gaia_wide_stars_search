# Параметри середовища фінального проєкту.
# Те, що змінюємо для експериментів, задаємо через spark-submit --conf.

spark.master                      local[*]
# 2g як у ДЗ 5/7 замало: на етапі 2 в пам'яті комірки з копіями зірок
spark.driver.memory               6g

# Журнал подій -> History Server (http://localhost:18080)
spark.eventLog.enabled            true
spark.eventLog.dir                file:///opt/spark/spark-events
spark.history.fs.logDirectory     file:///opt/spark/spark-events
# журнал повного запуску йде в здачу (evidence/), стиснений він у кілька разів менший
spark.eventLog.compress           true

# Python усередині контейнера
spark.pyspark.python              python3
